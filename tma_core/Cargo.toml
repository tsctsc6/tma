[package]
name = "tma_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tma_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
reqwest = "0.13.4"
rodio = { version = "0.22.2", features = ["symphonia-all"] }
stream-download = "0.24.1"
thiserror = "2.0.18"
tokio = "1.52.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
